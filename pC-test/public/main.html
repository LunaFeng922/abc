<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <link rel="manifest" href="manifest.json" />
  <title>pC-test</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="lib/p5.js"></script>
  <script src="socket.io/socket.io.js"></script>
</head>

<body>
  <div class="main-wrapper">
    <div id="p5-canvas-container"></div>
  </div>

  <div id="composeOverlay" class="overlay hidden">
    <div class="compose-bubble">
      <textarea id="composeText" placeholder="write something..."></textarea>
      <div class="compose-buttons">
        <button id="cancelBtn" type="button">Cancel</button>
        <button id="addBtn" type="button">Add</button>
      </div>
    </div>
  </div>

  <div id="readOverlay" class="overlay hidden">
    <div class="read-bubble">
      <div id="readText"></div>
      <div id="readAuthor"></div>
    </div>
  </div>

  <script src="slotPath.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
