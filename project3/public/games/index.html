<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap"
      rel="stylesheet"
    />

    <title>Games</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Pixelify Sans", sans-serif;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: rgb(254, 255, 225);
        touch-action: manipulation;
      }

      #top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        background: rgb(254, 255, 225);
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        z-index: 10;
      }

      #back-btn {
        background: transparent;
        border: none;
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
      }

      #top-title {
        font-size: 14px;
        font-weight: bold;
        color: #333;
      }

      #game-grid {
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow-y: auto;
        padding: 20px 16px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        align-content: start;
      }

      .game-card {
        background: white;
        border-radius: 16px;
        border: 2px solid #eee;
        overflow: hidden;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.1s,
          border-color 0.1s;
        -webkit-tap-highlight-color: transparent;
      }

      .game-card:active {
        transform: scale(0.96);
        border-color: #00aeff;
      }

      .game-thumb {
        width: 100%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 56px;
        background: #f5f5f5;
      }

      .game-info {
        padding: 10px 12px 12px;
      }

      .game-title {
        font-size: 11px;
        font-weight: bold;
        color: #222;
        margin-bottom: 4px;
      }

      .game-desc {
        font-size: 9px;
        color: #888;
        line-height: 1.6;
        font-family: "Pixelify Sans", sans-serif;
      }

      .game-tag {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 8px;
        border-radius: 20px;
        background: rgb(214, 226, 255);
        color: #00aeff;
        font-size: 8px;
        font-family: "Pixelify Sans", sans-serif;
      }

      placeholder card for coming soon .game-card.coming-soon {
        opacity: 0.4;
        cursor: default;
      }
      .game-card.coming-soon:active {
        transform: none;
        border-color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="top-bar">
      <button id="back-btn" onclick="location.href = '/playground'">🏠</button>
      <span id="top-title">🎮 Games</span>
    </div>

    <div id="game-grid">
      <!-- Poop Run -->
      <a class="game-card" href="/games/poop-trace">
        <div class="game-thumb">💩</div>
        <div class="game-info">
          <div class="game-title">Poop Trace</div>
          <div class="game-desc">
            Guide your pet around the circle using food
          </div>
          <span class="game-tag">1 player</span>
        </div>
      </a>
    </div>
  </body>
</html>
